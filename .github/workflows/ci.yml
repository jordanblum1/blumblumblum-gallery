name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ vars.ENABLE_SELF_HOSTED_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","personal-pc"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment != 'self-hosted' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, and test in parallel
        shell: bash
        run: |
          pnpm lint & lint=$!
          pnpm exec tsc --noEmit & types=$!
          pnpm test & tests=$!

          status=0
          wait "$lint" || { echo "::error::Lint failed"; status=1; }
          wait "$types" || { echo "::error::Typecheck failed"; status=1; }
          wait "$tests" || { echo "::error::Tests failed"; status=1; }
          exit "$status"
